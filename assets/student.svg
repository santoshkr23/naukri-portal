<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 440" width="320" height="440">
  <!-- Original illustration for NaukriSetu job banners: a smiling student with books and an ID card -->
  <defs>
    <linearGradient id="kurta" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1fa59a"/><stop offset="1" stop-color="#0f766e"/></linearGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e6a97f"/><stop offset="1" stop-color="#d4916a"/></linearGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2b1a14"/><stop offset="1" stop-color="#140c09"/></linearGradient>
  </defs>
  <!-- hair behind -->
  <path d="M92 118 C82 60 128 28 168 30 C214 32 246 66 238 124 C236 180 250 252 226 316 C192 334 128 334 98 316 C76 252 98 178 92 118 Z" fill="url(#hair)"/>
  <!-- body -->
  <path d="M60 440 C62 360 86 318 128 302 L160 296 L192 302 C236 318 260 360 262 440 Z" fill="url(#kurta)"/>
  <!-- dupatta -->
  <path d="M108 306 C140 340 196 372 236 440 L198 440 C168 392 128 360 96 326 Z" fill="#ec4899"/>
  <path d="M108 306 C140 340 196 372 236 440" fill="none" stroke="#fbbf24" stroke-width="5" stroke-dasharray="2 9" stroke-linecap="round"/>
  <!-- neck -->
  <path d="M142 250 L178 250 L182 300 C172 312 148 312 138 300 Z" fill="#cf8a62"/>
  <!-- neckline -->
  <path d="M132 300 C146 326 174 326 188 300" fill="none" stroke="#0b5f58" stroke-width="5" stroke-linecap="round"/>
  <!-- lanyard + ID card -->
  <path d="M140 302 L156 372 M180 302 L164 372" stroke="#2563eb" stroke-width="6" stroke-linecap="round"/>
  <rect x="136" y="368" width="48" height="64" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <rect x="136" y="368" width="48" height="14" rx="6" fill="#2563eb"/>
  <rect x="146" y="388" width="16" height="18" rx="3" fill="#93c5fd"/>
  <rect x="146" y="412" width="28" height="4" rx="2" fill="#94a3b8"/><rect x="146" y="420" width="20" height="4" rx="2" fill="#cbd5e1"/>
